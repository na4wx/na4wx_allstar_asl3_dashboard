;**************************************************
;********   Template-tized usbradio.conf   ********
;**************************************************
; USBRadio channel driver Configuration File
;
;;;;;                 New to ASL3                 ;;;;;
;;;;; The USBRadio "tune" settings have moved to  ;;;;;
;;;;; this file. The usbradio_tune_usb_1999.conf  ;;;;;
;;;;; file is no longer used.                     ;;;;;

[general]
; jbenable = yes
; jbmaxsize = 200
; jbresyncthreshold = 1000
; jbimpl = fixed
; jblog = no

[node-main](!)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;; Template for all your USBRadio nodes ;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

eeprom = 0                  ; EEPROM installed: 0,1
hdwtype = 0
rxboost = yes
rxctcssrelax = 1
rxsqhyst = 3000
txctcssdefault = 100.0
rxctcssfreqs = 100.0,91.5
txctcssfreqs = 100.0,91.5
rxctcssoverride = no
carrierfrom = dsp
voxhangtime = 2000
ctcssfrom = dsp
rxdemod = flat
rxsquelchdelay = 30
rxondelay = 0
txoffdelay = 0
txboost = no
txprelim = yes
txlimonly = yes
txtoctype = notone
txmixa = composite
txmixb = no
rxlpf = 0
rxhpf = 0
txlpf = 0
txhpf = 0
invertptt = no
duplex = 0                  ; Duplex 0,1
                            ; 0 - half duplex
                            ; 1 - full duplex
duplex3 = 0
clipledgpio = 0
legacyaudioscaling = no

;;; End of node-main template

#tryinclude "custom/usbradio.conf"
#tryinclude "custom/usbradio/*.conf"

;;;;;;;;;;;;;;;;;;; Your node settings here ;;;;;;;;;;;;;;;;;;;
[1999](node-main)

;;;;; ASL3 Tune settings ;;;;;
devstr=
serial=
rxmixerset=500
txmixaset=500
txmixbset=500
rxvoiceadj=0.5
txctcssadj=200
rxsquelchadj=500
